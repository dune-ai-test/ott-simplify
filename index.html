<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CROUTON — Upcoming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css"/>
</head>
<body>

<div class="bg" id="bg">
  <img class="bg-layer" id="bgA" src="" alt=""/>
  <img class="bg-layer" id="bgB" src="" alt=""/>
  <div class="bg-veil"></div>
  <div class="glow" id="glow"></div>
</div>
<div class="grain" aria-hidden="true"></div>

<div class="chrome chrome-tl"><span class="brand">CROUTON<sup>®</sup></span><span class="chrome-sub">OTT · UPCOMING</span></div>
<div class="chrome chrome-tr"><span id="curIdx">01</span><i>/</i><span id="totIdx">06</span></div>
<div class="chrome chrome-bl">RELEASES · 2026—27</div>
<div class="chrome chrome-br">DRAG OR ← →</div>

<main class="stage" id="stage">
  <div class="carousel" id="carousel"><!-- cards injected by JS --></div>

  <section class="info" id="info">
    <div class="info-top">
      <span class="platform" id="platform">NETFLIX</span>
      <span class="rule"></span>
      <span class="date" id="dateLabel">26 OCT 2026</span>
      <span class="rule"></span>
      <span class="count" id="countLabel">IN 11 DAYS</span>
    </div>
    <h1 id="title">THE LAST LIGHT</h1>
    <p class="tagline" id="tagline">When the grid dies, he walks toward it.</p>
    <div class="dots" id="dots"></div>
  </section>

  <button class="nav nav--l" id="prevBtn" aria-label="Previous">‹</button>
  <button class="nav nav--r" id="nextBtn" aria-label="Next">›</button>
  <button class="pause" id="pauseBtn" aria-label="Pause">❚❚</button>
</main>

<script src="./app.js"></script>
</body>
</html>
